repos:
  astrid-pinokio: lane/M-PIN/R-20
gpu: false
max_minutes: 60
setup:
  - 'set -euo pipefail; test "$(git rev-parse HEAD)" = 0eadd747b9b62b29da770cbb42dbacbeb30312d2; TASK_TMP="$PWD/runpod-tmp"; mkdir -p "$TASK_TMP"; apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl gnupg git python3 make g++; curl -fsSL https://deb.nodesource.com/setup_20.x -o "$TASK_TMP/nodesource-setup.sh"; bash "$TASK_TMP/nodesource-setup.sh"; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs; node --version; npm --version; test "$(node -p "process.versions.node.split(\".\")[0]")" = 20; git clone -q https://github.com/pinokiocomputer/pinokiod.git "$TASK_TMP/pinokiod"; git -C "$TASK_TMP/pinokiod" checkout -q --detach add4a674ad1ba95bb62ec427fce519fe5bf0e9bf; npm ci --omit=dev --prefix "$TASK_TMP/pinokiod" --silent; git clone -q https://github.com/pinokiocomputer/pterm.git "$TASK_TMP/pterm"; git -C "$TASK_TMP/pterm" checkout -q --detach 5be43718701c448b43daf0ce51d8935f170065bb; npm ci --omit=dev --prefix "$TASK_TMP/pterm" --silent'
run:
  - 'set -euo pipefail; test "$(git rev-parse HEAD)" = 0eadd747b9b62b29da770cbb42dbacbeb30312d2; export TASK_TMP="$PWD/runpod-tmp" RUNNER_TEMP="$PWD/runpod-tmp" GITHUB_RUN_ID=runpod GITHUB_RUN_ATTEMPT=1 R20_LINUX_MODE=native; test "$(node -p "process.versions.node.split(\".\")[0]")" = 20; test "$(git -C "$TASK_TMP/pinokiod" rev-parse HEAD)" = add4a674ad1ba95bb62ec427fce519fe5bf0e9bf; test "$(git -C "$TASK_TMP/pterm" rev-parse HEAD)" = 5be43718701c448b43daf0ce51d8935f170065bb; test -d "$TASK_TMP/pinokiod/node_modules"; test -d "$TASK_TMP/pterm/node_modules/unws"; bash .github/venue/linux.sh'
artifacts:
  - 'runpod-tmp/r20-evidence/**'
