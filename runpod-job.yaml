repos:
  astrid-pinokio: lane/M-PIN/R-20-NATIVE-R2
gpu: false
max_minutes: 60
setup:
  - 'set -euo pipefail; test "$(git rev-parse HEAD)" = c50e5c3fd3e6e2423a4e62ea67b2513ff8228932; TASK_TMP="$PWD/runpod-tmp"; mkdir -p "$TASK_TMP"; export npm_config_cache="$TASK_TMP/npm-cache"; apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates curl gnupg git python3 make g++; curl -fsSL https://deb.nodesource.com/setup_20.x -o "$TASK_TMP/nodesource-setup.sh"; bash "$TASK_TMP/nodesource-setup.sh"; DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs; node --version; npm --version; test "$(node -p "process.versions.node.split(\".\")[0]")" = 20; git clone -q https://github.com/pinokiocomputer/pinokiod.git "$TASK_TMP/pinokiod"; git -C "$TASK_TMP/pinokiod" checkout -q --detach add4a674ad1ba95bb62ec427fce519fe5bf0e9bf; npm ci --omit=dev --prefix "$TASK_TMP/pinokiod" --silent >/dev/null 2>&1 || { printf "pinokiod npm ci failed\n"; exit 1; }; git clone -q https://github.com/pinokiocomputer/pterm.git "$TASK_TMP/pterm"; git -C "$TASK_TMP/pterm" checkout -q --detach 5be43718701c448b43daf0ce51d8935f170065bb; npm ci --omit=dev --prefix "$TASK_TMP/pterm" --silent >/dev/null 2>&1 || { printf "pterm npm ci failed\n"; exit 1; }'
run:
  - 'set -uo pipefail; export TASK_TMP="$PWD/runpod-tmp" RUNNER_TEMP="$PWD/runpod-tmp" GITHUB_RUN_ID=runpod GITHUB_RUN_ATTEMPT=1 R20_LINUX_MODE=native; evidence="$TASK_TMP/r20-evidence"; receipt_root="${R20_BROKER_OUT:-/workspace/out}"; test -d "$receipt_root" || exit 125; receipt="$(mktemp -d "$receipt_root/r20-native-r2-c50e5c3fd3e6-XXXXXX")"; inner=125; if test "$(git rev-parse HEAD)" = c50e5c3fd3e6e2423a4e62ea67b2513ff8228932 && test "$(node -p "process.versions.node.split(\".\")[0]")" = 20 && test "$(git -C "$TASK_TMP/pinokiod" rev-parse HEAD)" = add4a674ad1ba95bb62ec427fce519fe5bf0e9bf && test "$(git -C "$TASK_TMP/pterm" rev-parse HEAD)" = 5be43718701c448b43daf0ce51d8935f170065bb && test -d "$TASK_TMP/pinokiod/node_modules" && test -d "$TASK_TMP/pterm/node_modules/unws"; then if bash .github/venue/linux.sh; then inner=0; else inner=$?; fi; fi; printf "inner_exit=%s\n" "$inner" > "$receipt/inner-exit.txt"; for packet in settlement.json identity.txt postcondition.txt SHA256SUMS; do if test -f "$evidence/$packet"; then cp -- "$evidence/$packet" "$receipt/$packet"; fi; done; digest() { if test -f "$receipt/$1"; then set -- $(sha256sum "$receipt/$1"); printf "\\\"present\\\":true,\\\"sha256\\\":\\\"%s\\\"" "$1"; else printf "\\\"present\\\":false"; fi; }; required=0; for packet in settlement.json identity.txt postcondition.txt SHA256SUMS; do test -f "$receipt/$packet" || required=1; done; status=failed; if test "$inner" -eq 0 && test "$required" -eq 0; then status=passed; fi; printf "{\\\"schema\\\":\\\"r20-native-r2\\\",\\\"status\\\":\\\"%s\\\",\\\"product_sha\\\":\\\"c50e5c3fd3e6e2423a4e62ea67b2513ff8228932\\\",\\\"pinokiod_sha\\\":\\\"add4a674ad1ba95bb62ec427fce519fe5bf0e9bf\\\",\\\"pterm_sha\\\":\\\"5be43718701c448b43daf0ce51d8935f170065bb\\\",\\\"inner_exit\\\":%s,\\\"packets\\\":{\\\"settlement.json\\\":{%s},\\\"identity.txt\\\":{%s},\\\"postcondition.txt\\\":{%s},\\\"SHA256SUMS\\\":{%s}}}\\n" "$status" "$inner" "$(digest settlement.json)" "$(digest identity.txt)" "$(digest postcondition.txt)" "$(digest SHA256SUMS)" > "$receipt/result.json"; if test "$inner" -ne 0; then exit "$inner"; fi; if test "$required" -ne 0; then exit 1; fi'
artifacts:
  - '/workspace/out/r20-native-r2-c50e5c3fd3e6-*/**'
