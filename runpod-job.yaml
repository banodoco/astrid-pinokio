repos:
  astrid-pinokio: c50e5c3fd3e6e2423a4e62ea67b2513ff8228932
gpu: false
max_minutes: 60
setup:
  - |
    set -x
    set -uo pipefail
    PRODUCT_EXPECTED=c50e5c3fd3e6e2423a4e62ea67b2513ff8228932
    REQUEST_REF=lane/M-PIN/R-20-NATIVE-R4-runpod
    PRODUCT_ACTUAL="$(git rev-parse HEAD 2>/dev/null || printf unavailable)"
    REQUEST_ACTUAL="$(git ls-remote https://github.com/banodoco/astrid-pinokio.git "refs/heads/$REQUEST_REF" | awk 'NR == 1 { print $1 }' || true)"
    test -n "$REQUEST_ACTUAL" || REQUEST_ACTUAL=unavailable
    REQUEST_EXPECTED="$REQUEST_ACTUAL"
    printf 'expected_product_sha=%s\nactual_product_sha=%s\nexpected_request_ref=%s\nexpected_request_sha=%s\nactual_request_sha=%s\n' "$PRODUCT_EXPECTED" "$PRODUCT_ACTUAL" "$REQUEST_REF" "$REQUEST_EXPECTED" "$REQUEST_ACTUAL"
    TASK_TMP="$PWD/runpod-tmp"
    mkdir -p "$TASK_TMP"
    export npm_config_cache="$TASK_TMP/npm-cache"
    SETUP_STATUS=0
    test "$REQUEST_EXPECTED" != unavailable || SETUP_STATUS=1
    apt-get update || SETUP_STATUS=1
    DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gnupg git python3 make g++ || SETUP_STATUS=1
    curl -fL https://deb.nodesource.com/setup_20.x -o "$TASK_TMP/nodesource-setup.sh" || SETUP_STATUS=1
    if test -f "$TASK_TMP/nodesource-setup.sh"; then bash "$TASK_TMP/nodesource-setup.sh" || SETUP_STATUS=1; else SETUP_STATUS=1; fi
    DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs || SETUP_STATUS=1
    if command -v node >/dev/null 2>&1; then printf 'node='; node --version || SETUP_STATUS=1; else printf 'node=unavailable\n'; SETUP_STATUS=1; fi
    if command -v npm >/dev/null 2>&1; then printf 'npm='; npm --version || SETUP_STATUS=1; else printf 'npm=unavailable\n'; SETUP_STATUS=1; fi
    git clone https://github.com/pinokiocomputer/pinokiod.git "$TASK_TMP/pinokiod" || SETUP_STATUS=1
    if test -d "$TASK_TMP/pinokiod/.git"; then git -C "$TASK_TMP/pinokiod" checkout --detach add4a674ad1ba95bb62ec427fce519fe5bf0e9bf || SETUP_STATUS=1; else SETUP_STATUS=1; fi
    PINOKIOD_ACTUAL="$(git -C "$TASK_TMP/pinokiod" rev-parse HEAD 2>/dev/null || printf unavailable)"
    printf 'expected_pinokiod_sha=add4a674ad1ba95bb62ec427fce519fe5bf0e9bf\nactual_pinokiod_sha=%s\n' "$PINOKIOD_ACTUAL"
    if command -v node >/dev/null 2>&1 && test -f "$TASK_TMP/pinokiod/package.json"; then printf 'pinokiod_version='; node -p "require('$TASK_TMP/pinokiod/package.json').version" || SETUP_STATUS=1; else printf 'pinokiod_version=unavailable\n'; SETUP_STATUS=1; fi
    if test -d "$TASK_TMP/pinokiod" && command -v npm >/dev/null 2>&1; then npm ci --omit=dev --prefix "$TASK_TMP/pinokiod" || SETUP_STATUS=1; else SETUP_STATUS=1; fi
    git clone https://github.com/pinokiocomputer/pterm.git "$TASK_TMP/pterm" || SETUP_STATUS=1
    if test -d "$TASK_TMP/pterm/.git"; then git -C "$TASK_TMP/pterm" checkout --detach 5be43718701c448b43daf0ce51d8935f170065bb || SETUP_STATUS=1; else SETUP_STATUS=1; fi
    PTERM_ACTUAL="$(git -C "$TASK_TMP/pterm" rev-parse HEAD 2>/dev/null || printf unavailable)"
    printf 'expected_pterm_sha=5be43718701c448b43daf0ce51d8935f170065bb\nactual_pterm_sha=%s\n' "$PTERM_ACTUAL"
    if command -v node >/dev/null 2>&1 && test -f "$TASK_TMP/pterm/package.json"; then printf 'pterm_version='; node -p "require('$TASK_TMP/pterm/package.json').version" || SETUP_STATUS=1; else printf 'pterm_version=unavailable\n'; SETUP_STATUS=1; fi
    if test -d "$TASK_TMP/pterm" && command -v npm >/dev/null 2>&1; then npm ci --omit=dev --prefix "$TASK_TMP/pterm" || SETUP_STATUS=1; else SETUP_STATUS=1; fi
    printf 'setup_status=%s\nexpected_product_sha=%s\nactual_product_sha=%s\nrequest_ref=%s\nexpected_request_sha=%s\nactual_request_sha=%s\npinokiod_sha=%s\npterm_sha=%s\n' "$SETUP_STATUS" "$PRODUCT_EXPECTED" "$PRODUCT_ACTUAL" "$REQUEST_REF" "$REQUEST_EXPECTED" "$REQUEST_ACTUAL" "$PINOKIOD_ACTUAL" "$PTERM_ACTUAL" > "$TASK_TMP/setup-state.env"
run:
  - |
    set -x
    set -uo pipefail
    PRODUCT_EXPECTED=c50e5c3fd3e6e2423a4e62ea67b2513ff8228932
    REQUEST_REF=lane/M-PIN/R-20-NATIVE-R4-runpod
    TASK_TMP="$PWD/runpod-tmp"
    RECEIPT=/workspace/out/r20-native-r4-c50e5c3fd3e6-1
    mkdir -p "$RECEIPT"
    PRODUCT_ACTUAL="$(git rev-parse HEAD 2>/dev/null || printf unavailable)"
    REQUEST_ACTUAL="$(git ls-remote https://github.com/banodoco/astrid-pinokio.git "refs/heads/$REQUEST_REF" | awk 'NR == 1 { print $1 }' || true)"
    test -n "$REQUEST_ACTUAL" || REQUEST_ACTUAL=unavailable
    REQUEST_EXPECTED="$REQUEST_ACTUAL"
    SETUP_STATUS=1
    PINOKIOD_ACTUAL=unavailable
    PTERM_ACTUAL=unavailable
    if test -f "$TASK_TMP/setup-state.env"; then . "$TASK_TMP/setup-state.env"; fi
    RUN_ID="$(printf '%s' "${GITHUB_RUN_ID:-runpod}" | tr -c 'A-Za-z0-9._:-' '_')"
    ATTEMPT="$(printf '%s' "${GITHUB_RUN_ATTEMPT:-1}" | tr -c 'A-Za-z0-9._:-' '_')"
    JOB_ID="$(printf '%s' "${RUNPOD_JOB_ID:-unavailable}" | tr -c 'A-Za-z0-9._:-' '_')"
    printf 'expected_product_sha=%s\nactual_product_sha=%s\nexpected_request_ref=%s\nexpected_request_sha=%s\nactual_request_sha=%s\nrun_id=%s\nattempt=%s\njob_id=%s\n' "$PRODUCT_EXPECTED" "$PRODUCT_ACTUAL" "$REQUEST_REF" "$REQUEST_EXPECTED" "$REQUEST_ACTUAL" "$RUN_ID" "$ATTEMPT" "$JOB_ID" > "$RECEIPT/request-identity.txt"
    PHASE=setup
    REASON=setup_failed
    INNER=125
    FOCUSED_EXIT=125
    if test "$SETUP_STATUS" = 0 && test "$PRODUCT_ACTUAL" = "$PRODUCT_EXPECTED" && test "$REQUEST_EXPECTED" != unavailable && test "$REQUEST_ACTUAL" = "$REQUEST_EXPECTED" && test "$PINOKIOD_ACTUAL" = add4a674ad1ba95bb62ec427fce519fe5bf0e9bf && test "$PTERM_ACTUAL" = 5be43718701c448b43daf0ce51d8935f170065bb && test -d "$TASK_TMP/pinokiod/node_modules" && test -d "$TASK_TMP/pterm/node_modules/unws"; then
      PHASE=preflight
      if node --test tests/venue-linux-native.test.mjs; then
        FOCUSED_EXIT=0
        PHASE=action
        REASON=action_failed
        if R20_LINUX_MODE=native TASK_TMP="$TASK_TMP" RUNNER_TEMP="$TASK_TMP" GITHUB_RUN_ID="$RUN_ID" GITHUB_RUN_ATTEMPT="$ATTEMPT" bash .github/venue/linux.sh; then INNER=0; REASON=none; else INNER=$?; fi
      else
        FOCUSED_EXIT=$?
        INNER=$FOCUSED_EXIT
        REASON=focused_test_failed
      fi
    fi
    EVIDENCE="$TASK_TMP/r20-evidence"
    if test -f "$EVIDENCE/identity.txt"; then cp -- "$EVIDENCE/identity.txt" "$RECEIPT/identity.txt"; else printf 'candidate=%s\ndaemon=%s\npterm=%s\nmode=native run=%s attempt=%s\n' "$PRODUCT_ACTUAL" "$PINOKIOD_ACTUAL" "$PTERM_ACTUAL" "$RUN_ID" "$ATTEMPT" > "$RECEIPT/identity.txt"; fi
    for PACKET in settlement.json postcondition.txt; do if test -f "$EVIDENCE/$PACKET"; then cp -- "$EVIDENCE/$PACKET" "$RECEIPT/$PACKET"; fi; done
    if test -f "$EVIDENCE/SHA256SUMS"; then cp -- "$EVIDENCE/SHA256SUMS" "$RECEIPT/action-SHA256SUMS.txt"; fi
    if test "$INNER" -eq 0; then
      PHASE=collector
      REASON=collector_failed
      if test -f "$RECEIPT/settlement.json" && test -f "$RECEIPT/postcondition.txt" && test -f "$RECEIPT/action-SHA256SUMS.txt" && node -e 'const fs=require("node:fs"); const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (s.running_after !== false) process.exit(1);' "$RECEIPT/settlement.json" && grep -Fx 'program directory absent after Reset' "$RECEIPT/postcondition.txt" && node -e 'const net=require("node:net"); const s=net.createServer(); s.on("error",()=>process.exit(1)); s.listen(42000,"127.0.0.1",()=>s.close(()=>process.exit(0)));'; then
        printf 'port_42000_released=true\nprogram_directory_absent=true\nrunning_after=false\n' > "$RECEIPT/cleanup.txt"
        REASON=none
      else
        INNER=1
      fi
    fi
    MISSING=''
    for PACKET in settlement.json identity.txt postcondition.txt action-SHA256SUMS.txt; do if ! test -f "$RECEIPT/$PACKET"; then MISSING="${MISSING}${PACKET}\n"; fi; done
    if test -n "$MISSING"; then printf '%b' "$MISSING" > "$RECEIPT/MISSING-ACTION-PACKETS.txt"; fi
    STATUS=failed
    if test "$INNER" -eq 0 && test -z "$MISSING"; then STATUS=passed; fi
    printf 'inner_exit=%s\nfocused_test_exit=%s\n' "$INNER" "$FOCUSED_EXIT" > "$RECEIPT/inner-exit.txt"
    printf '{"schema":"r20-native-r4-phase-v1","phase":"%s","reason":"%s","product_sha":"%s","request_ref":"%s","expected_request_sha":"%s","actual_request_sha":"%s","run_id":"%s","attempt":"%s","job_id":"%s","inner_exit":%s,"focused_test_exit":%s}\n' "$PHASE" "$REASON" "$PRODUCT_ACTUAL" "$REQUEST_REF" "$REQUEST_EXPECTED" "$REQUEST_ACTUAL" "$RUN_ID" "$ATTEMPT" "$JOB_ID" "$INNER" "$FOCUSED_EXIT" > "$RECEIPT/phase.json"
    printf '{"schema":"r20-native-r4-result-v1","status":"%s","product":{"expected":"%s","actual":"%s"},"request":{"ref":"%s","expected":"%s","actual":"%s"},"run_id":"%s","attempt":"%s","job_id":"%s","phase":"%s","inner_exit":%s,"focused_test_exit":%s,"running_after":%s}\n' "$STATUS" "$PRODUCT_EXPECTED" "$PRODUCT_ACTUAL" "$REQUEST_REF" "$REQUEST_EXPECTED" "$REQUEST_ACTUAL" "$RUN_ID" "$ATTEMPT" "$JOB_ID" "$PHASE" "$INNER" "$FOCUSED_EXIT" "$(test "$STATUS" = passed && printf false || printf null)" > "$RECEIPT/result.json"
    printf 'R-20-NATIVE-R4 status=%s phase=%s inner_exit=%s\n' "$STATUS" "$PHASE" "$INNER" > "$RECEIPT/SUMMARY.txt"
    (cd "$RECEIPT" && rm -f SHA256SUMS && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
    exit "$INNER"
artifacts:
  - /workspace/out/job.log
  - /workspace/out/exit-codes.txt
  - /workspace/out/r20-native-r4-c50e5c3fd3e6-1/**
