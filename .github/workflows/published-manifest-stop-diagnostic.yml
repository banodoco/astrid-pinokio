name: Published manifest Stop diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-stop-diagnostic:
    name: Windows Stop with proof-only App manifest
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Run bounded changed-input Stop diagnostic
        run: node tests/smoke/run-pinokio.mjs hosted-proof-manifest
