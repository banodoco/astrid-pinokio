name: Genuine Pinokio venue (non-release)

on:
  push:
    branches:
      - task/m4-6-genuine-pinokio-venue
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genuine-pinokio-venue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genuine-venue:
    name: Pinned Pinokio daemon and source-backed control probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PINOKIO_COMMIT: ${{ github.sha }}
      PINOKIO_BASE_COMMIT: c5b42701641889ecb916c60cde09a717f83d62ff
      PINOKIOD_REF: add4a674ad1ba95bb62ec427fce519fe5bf0e9bf
      PTERM_REF: 5be43718701c448b43daf0ce51d8935f170065bb
      PINOKIOD_ROOT: ${{ runner.temp }}/m4-6-pinokio/pinokiod
      PTERM_ROOT: ${{ runner.temp }}/m4-6-pinokio/pterm
      PINOKIO_HOME: ${{ runner.temp }}/m4-6-pinokio/home
      VENUE_EVIDENCE_DIR: ${{ runner.temp }}/m4-6-pinokio/evidence
      VENUE_DIAGNOSTIC_DIR: ${{ runner.temp }}/m4-6-pinokio/local-diagnostics
    steps:
      - name: Checkout clean Pinokio candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9afca # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up supported Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.4

      - name: Bootstrap immutable Pinokio daemon and pterm sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m4-6-pinokio"
          git clone --no-checkout https://github.com/pinokiocomputer/pinokiod.git "$PINOKIOD_ROOT"
          git -C "$PINOKIOD_ROOT" checkout --detach "$PINOKIOD_REF"
          test "$(git -C "$PINOKIOD_ROOT" rev-parse HEAD)" = "$PINOKIOD_REF"
          npm ci --no-audit --no-fund --prefix "$PINOKIOD_ROOT"
          git clone --no-checkout https://github.com/pinokiocomputer/pterm.git "$PTERM_ROOT"
          git -C "$PTERM_ROOT" checkout --detach "$PTERM_REF"
          test "$(git -C "$PTERM_ROOT" rev-parse HEAD)" = "$PTERM_REF"
          npm ci --no-audit --no-fund --prefix "$PTERM_ROOT"
          node --version
          git -C "$PINOKIOD_ROOT" rev-parse HEAD
          git -C "$PTERM_ROOT" rev-parse HEAD

      - name: Run genuine engine venue probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m4-6-pinokio/user-home"
          export HOME="$RUNNER_TEMP/m4-6-pinokio/user-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          node tests/genuine-pinokio-venue.mjs

      - name: Publish redacted venue evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: genuine-pinokio-venue-evidence
          path: ${{ runner.temp }}/m4-6-pinokio/evidence/venue-evidence.json
          if-no-files-found: error
