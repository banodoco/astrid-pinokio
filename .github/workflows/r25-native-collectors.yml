name: R-25 native collector route

on:
  # This is the one immutable ref allowed to launch the native component
  # probes without a default-branch workflow_dispatch registration.
  push:
    branches:
      - venue/M-PIN-R-25-NATIVE-PROBE-R1
  workflow_dispatch:
    inputs:
      tuple_json:
        description: Canonical CURRENT-TUPLE.json object, supplied by M-INT/M-VENUE
        required: true
        type: string
      source_ref:
        description: Immutable adapter source commit
        required: true
        default: 47059b072889b489b2db20d3a3e86acf02e5a3d4
        type: string
      target_os:
        description: Native collector platform(s)
        required: true
        default: both
        type: choice
        options: [macos, windows, both]
      mode:
        description: Pinokio slot mode(s) to bind
        required: true
        default: both
        type: choice
        options: [backend, fully-local, both]

permissions:
  contents: read

jobs:
  macos:
    if: github.event_name == 'push' || inputs.target_os == 'macos' || inputs.target_os == 'both'
    runs-on: macos-14
    timeout-minutes: 15
    env:
      # A push has no workflow_dispatch inputs.  Its candidate tuple and
      # source identity are deliberately fixed here; manual dispatch remains
      # available for an explicitly supplied canonical tuple.
      TUPLE_JSON: ${{ github.event_name == 'push' && '{"app":"79f7e5397c044c4c97dc7e97b20ad96f787e5247","agent":"ab43bad818ef65ca1e929b973a2f61cd9fc4bf61","runtime":"2776ba973b6c8f3555b5629b0840d9691a98d3c2","pinokio":"3a6a98ae251ca126505245286e2d3e760f4348e9","manifest_sha256":"b2584f0bb5a949890364004572a0182f2b568adcdba061e73b739e1d3d2d623f"}' || inputs.tuple_json }}
      SOURCE_REF: ${{ github.event_name == 'push' && '47059b072889b489b2db20d3a3e86acf02e5a3d4' || inputs.source_ref }}
      MODE: ${{ github.event_name == 'push' && 'both' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Materialize immutable adapter source and validate binding
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/r25-macos-source"
          echo "SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
          mkdir -p "$source_root"
          git fetch --no-tags --depth=1 origin "$SOURCE_REF"
          git archive FETCH_HEAD -- \
            .github/venue/adapters/macos-observer.c \
            .github/venue/adapters/macos-observer.cjs \
            tests/macos-observer.test.mjs \
            .github/workflows/r25-os-adapters.yml | tar -x -C "$source_root"
          node pinokio/providers/r25-native-collector-binding.cjs \
            --tuple-json "$TUPLE_JSON" --candidate-ref "$GITHUB_SHA" \
            --source-ref "$SOURCE_REF" --target-os macos --mode "$MODE" \
            --source-root "$source_root" --output "$RUNNER_TEMP/r25-native-binding-macos.json"
      - name: Build fixed Endpoint Security helper
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$sdk/System/Library/Frameworks/EndpointSecurity.framework"
          /usr/bin/clang -isysroot "$sdk" -O2 -Wall -Wextra -fblocks \
            "$SOURCE_ROOT/.github/venue/adapters/macos-observer.c" \
            -framework EndpointSecurity -lbsm \
            -o "$SOURCE_ROOT/.github/venue/adapters/macos-observer"
      - name: Retain bounded macOS helper identity
        shell: bash
        run: shasum -a 256 "$SOURCE_ROOT/.github/venue/adapters/macos-observer" > "$RUNNER_TEMP/r25-native-macos-helper.sha256"
      - name: Run focused native parser/route test
        shell: bash
        working-directory: ${{ runner.temp }}/r25-macos-source
        run: node --test tests/macos-observer.test.mjs
      - name: Retain bounded binding result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-native-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r25-native-binding-macos.json
            ${{ runner.temp }}/r25-native-macos-helper.sha256
          if-no-files-found: warn
          retention-days: 30

  windows:
    if: github.event_name == 'push' || inputs.target_os == 'windows' || inputs.target_os == 'both'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      # Keep this byte-for-byte identical to the macOS push binding.
      TUPLE_JSON: ${{ github.event_name == 'push' && '{"app":"79f7e5397c044c4c97dc7e97b20ad96f787e5247","agent":"ab43bad818ef65ca1e929b973a2f61cd9fc4bf61","runtime":"2776ba973b6c8f3555b5629b0840d9691a98d3c2","pinokio":"3a6a98ae251ca126505245286e2d3e760f4348e9","manifest_sha256":"b2584f0bb5a949890364004572a0182f2b568adcdba061e73b739e1d3d2d623f"}' || inputs.tuple_json }}
      SOURCE_REF: ${{ github.event_name == 'push' && '47059b072889b489b2db20d3a3e86acf02e5a3d4' || inputs.source_ref }}
      MODE: ${{ github.event_name == 'push' && 'both' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Materialize immutable adapter source and validate binding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'r25-windows-source'
          "SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          git fetch --no-tags --depth=1 origin $env:SOURCE_REF
          git archive FETCH_HEAD -- `
            pinokio/windows-observer/adapter.mjs `
            pinokio/windows-observer/etw-observer.cpp `
            tests/windows-observer-adapter.test.mjs `
            .github/workflows/r25-os-adapters.yml | tar -x -C $sourceRoot
          node pinokio/providers/r25-native-collector-binding.cjs `
            --tuple-json $env:TUPLE_JSON --candidate-ref $env:GITHUB_SHA `
            --source-ref $env:SOURCE_REF --target-os windows --mode $env:MODE `
            --source-root $sourceRoot --output "$env:RUNNER_TEMP\r25-native-binding-windows.json"
      - name: Run focused Windows build and bounded ETW test
        shell: pwsh
        working-directory: ${{ runner.temp }}\r25-windows-source
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $exe = Join-Path $PWD 'pinokio\windows-observer\etw-observer.exe'
          $source = Join-Path $PWD 'pinokio\windows-observer\etw-observer.cpp'
          $obj = Join-Path $env:RUNNER_TEMP 'r25-etw-observer.obj'
          $build = "call `"$setup`" >nul && cl /nologo /EHsc /W4 /O2 /Fo`"$obj`" /Fe`"$exe`" `"$source`" /link advapi32.lib ole32.lib"
          & cmd.exe /d /s /c $build
          if ($LASTEXITCODE -ne 0) { throw "fixed ETW helper build failed with exit $LASTEXITCODE" }
          @{ source_ref = $env:SOURCE_REF; executable = 'pinokio/windows-observer/etw-observer.exe'; sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\r25-native-windows-helper.json"
          node tests/windows-observer-adapter.test.mjs
      - name: Retain bounded binding result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-native-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\r25-native-binding-windows.json
            ${{ runner.temp }}\r25-native-windows-helper.json
          if-no-files-found: warn
          retention-days: 30
