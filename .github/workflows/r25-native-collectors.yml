name: R-25 snapshot collector component route

on:
  workflow_dispatch:
    inputs:
      agent_ref:
        description: Immutable astrid-agent snapshot collector commit
        required: true
        default: 21a53a9c241f403a80b103cd136d6e785c12b3fc
        type: string
      target_os:
        description: Platform component probe(s); not M4-6 evidence
        required: true
        default: both
        type: choice
        options: [macos, windows, both]

permissions:
  contents: read

jobs:
  macos-component:
    if: inputs.target_os == 'macos' || inputs.target_os == 'both'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      AGENT_REF: ${{ inputs.agent_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Materialize exact Agent source
        shell: bash
        env:
          AGENT_ROOT: ${{ runner.temp }}/astrid-agent
        run: |
          set -euo pipefail
          test "$AGENT_REF" = 21a53a9c241f403a80b103cd136d6e785c12b3fc
          git clone --filter=blob:none --no-checkout https://github.com/banodoco/astrid-agent.git "$AGENT_ROOT"
          git -C "$AGENT_ROOT" fetch --no-tags --depth=1 origin "$AGENT_REF"
          git -C "$AGENT_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$AGENT_ROOT" rev-parse HEAD)" = "$AGENT_REF"
      - name: Validate source binding and focused parsers
        shell: bash
        env:
          AGENT_ROOT: ${{ runner.temp }}/astrid-agent
          ROUTE: ${{ runner.temp }}/r25-macos-component-route.json
        run: |
          set -euo pipefail
          node pinokio/providers/r25-native-collector-binding.cjs \
            --validate-source-only true --agent-ref "$AGENT_REF" \
            --agent-root "$AGENT_ROOT" --pinokio-root "$GITHUB_WORKSPACE" > "$ROUTE"
          node --test \
            tests/r25-native-collector-binding.test.cjs \
            tests/r25-snapshot-macos.test.cjs
          python3 -m py_compile \
            "$AGENT_ROOT/scripts/pinokio_snapshot_collector.py" \
            "$AGENT_ROOT/scripts/pinokio_snapshot_macos.py"
      - name: Execute one direct macOS component snapshot
        shell: bash
        env:
          AGENT_ROOT: ${{ runner.temp }}/astrid-agent
          SNAPSHOT: ${{ runner.temp }}/r25-macos-component-snapshot.json
        run: |
          set -euo pipefail
          PYTHONPATH="$AGENT_ROOT" python3 -m scripts.pinokio_snapshot_macos \
            --launchd-target "gui/$(id -u)/haus.astrid.runtime" > "$SNAPSHOT"
          node -e "const fs=require('node:fs'); const p=require('./pinokio/providers/r25-snapshot-macos.cjs'); p.parseObservation(fs.readFileSync(process.env.SNAPSHOT));"
      - name: Retain component-only output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-snapshot-component-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r25-macos-component-route.json
            ${{ runner.temp }}/r25-macos-component-snapshot.json
          if-no-files-found: warn
          retention-days: 30

  windows-component:
    if: inputs.target_os == 'windows' || inputs.target_os == 'both'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      AGENT_REF: ${{ inputs.agent_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Materialize exact Agent source
        shell: pwsh
        env:
          AGENT_ROOT: ${{ runner.temp }}\astrid-agent
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AGENT_REF -ne '21a53a9c241f403a80b103cd136d6e785c12b3fc') { throw 'agent_ref differs' }
          git clone --filter=blob:none --no-checkout https://github.com/banodoco/astrid-agent.git $env:AGENT_ROOT
          git -C $env:AGENT_ROOT fetch --no-tags --depth=1 origin $env:AGENT_REF
          git -C $env:AGENT_ROOT checkout --detach FETCH_HEAD
          if ((git -C $env:AGENT_ROOT rev-parse HEAD) -ne $env:AGENT_REF) { throw 'Agent HEAD differs' }
      - name: Validate source binding and focused parsers
        shell: pwsh
        env:
          AGENT_ROOT: ${{ runner.temp }}\astrid-agent
          ROUTE: ${{ runner.temp }}\r25-windows-component-route.json
        run: |
          $ErrorActionPreference = 'Stop'
          node pinokio/providers/r25-native-collector-binding.cjs `
            --validate-source-only true --agent-ref $env:AGENT_REF `
            --agent-root $env:AGENT_ROOT --pinokio-root $env:GITHUB_WORKSPACE | Set-Content -Encoding utf8 $env:ROUTE
          node --test tests/r25-native-collector-binding.test.cjs tests/r25-snapshot-windows.test.cjs
          python -m py_compile `
            "$env:AGENT_ROOT\scripts\pinokio_snapshot_collector.py" `
            "$env:AGENT_ROOT\scripts\pinokio_snapshot_windows.py"
      - name: Execute one direct Windows component snapshot
        shell: pwsh
        env:
          AGENT_ROOT: ${{ runner.temp }}\astrid-agent
          SNAPSHOT: ${{ runner.temp }}\r25-windows-component-snapshot.json
        run: |
          $ErrorActionPreference = 'Stop'
          $taskName = "Astrid R25 Present $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $taskPath = '\' + $taskName
          $taskRegistered = $false
          try {
            $action = New-ScheduledTaskAction `
              -Execute "$env:SystemRoot\System32\cmd.exe" `
              -Argument '/c exit 0'
            $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddHours(1)
            $definition = New-ScheduledTask -Action $action -Trigger $trigger `
              -Description 'R-25 disposable present-task collector target'
            Register-ScheduledTask -TaskName $taskName -TaskPath '\' `
              -InputObject $definition -Force | Out-Null
            $taskRegistered = $true
            $env:R25_TASK_TARGET = $taskPath
            $env:PYTHONPATH = $env:AGENT_ROOT
            python -c "import json, os; from scripts.pinokio_snapshot_windows import collect_windows_snapshot; print(json.dumps(collect_windows_snapshot(scheduled_task_paths=[os.environ['R25_TASK_TARGET']], service_names=['AstridRuntime']), sort_keys=True, separators=(',', ':')))" | Set-Content -Encoding utf8 $env:SNAPSHOT
            $collectorExit = $LASTEXITCODE
            if ($collectorExit -ne 0) { throw "collector exit $collectorExit" }
            node -e "const fs=require('node:fs'); const p=require('./pinokio/providers/r25-snapshot-windows.cjs'); p.validateObservation(JSON.parse(fs.readFileSync(process.env.SNAPSHOT, 'utf8').replace(/^\uFEFF/, '')));"
            $validatorExit = $LASTEXITCODE
            if ($validatorExit -ne 0) { throw "snapshot validator exit $validatorExit" }
          } finally {
            if ($taskRegistered) {
              Unregister-ScheduledTask -TaskName $taskName -TaskPath '\' `
                -Confirm:$false -ErrorAction SilentlyContinue
            }
          }
      - name: Retain component-only output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-snapshot-component-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\r25-windows-component-route.json
            ${{ runner.temp }}\r25-windows-component-snapshot.json
          if-no-files-found: warn
          retention-days: 30
