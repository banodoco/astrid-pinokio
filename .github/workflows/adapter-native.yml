name: Native observer adapter checks

on:
  push:
    branches: [lane/M-PIN/R-25-ADAPTER-CI, lane/M-PIN/R-25-ADAPTER-CI-R1, lane/M-PIN/R-25-ADAPTER-SDK-PROBE-R1, lane/M-PIN/R-25-WIN-ADAPTER-TEST-CI-R1]

permissions:
  contents: read

jobs:
  macos-adapter:
    name: macOS adapter build and focused test
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Record macOS SDK and minimal link probe
        run: |
          mkdir -p "$RUNNER_TEMP/macos-sdk-probe"
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          XCODE_PATH="$(xcode-select -p)"
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          {
            printf 'xcode_select_path=%s\n' "$XCODE_PATH"
            xcodebuild -version
            printf 'sdk_path=%s\n' "$SDKROOT"
            printf 'sdk_version=%s\n' "$SDK_VERSION"
            if [ -d "$SDKROOT/System/Library/Frameworks/EndpointSecurity.framework" ]; then
              echo 'framework_present=true'
            else
              echo 'framework_present=false'
            fi
            if printf 'int main(void) { return 0; }\n' | clang -x c -isysroot "$SDKROOT" -framework EndpointSecurity -o "$RUNNER_TEMP/macos-sdk-probe-link" - >/dev/null 2>&1; then
              echo 'minimal_link=success'
            else
              echo 'minimal_link=failure'
            fi
          } > "$RUNNER_TEMP/macos-sdk-probe/facts.txt"
          printf 'SDKROOT=%s\n' "$SDKROOT" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/macos-sdk-probe/facts.txt"
      - name: Compile native adapter
        run: |
          mkdir -p "$RUNNER_TEMP/macos-adapter"
          clang -isysroot "$SDKROOT" -O2 -Wall -Wextra -fblocks .github/venue/adapters/macos-observer.c -framework EndpointSecurity -lbsm -o "$RUNNER_TEMP/macos-adapter/macos-observer"
          (cd "$RUNNER_TEMP/macos-adapter" && shasum -a 256 macos-observer) > "$RUNNER_TEMP/macos-sdk-probe/SHA256SUMS"
      - name: Run focused adapter test
        if: ${{ !cancelled() }}
        run: node --test tests/macos-observer.test.mjs
      - name: Upload bounded macOS probe facts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-sdk-probe-facts
          path: ${{ runner.temp }}/macos-sdk-probe/
          if-no-files-found: error

  windows-adapter:
    if: github.ref != 'refs/heads/lane/M-PIN/R-25-ADAPTER-SDK-PROBE-R1'
    name: Windows adapter build and focused test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Compile native adapter
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Visual Studio C++ toolchain is required' }
          $setup = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $out = Join-Path $env:RUNNER_TEMP 'windows-adapter'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $source = Join-Path $env:GITHUB_WORKSPACE 'pinokio\windows-observer\etw-observer.cpp'
          $exe = Join-Path $out 'etw-observer.exe'
          $obj = Join-Path $out 'observer.obj'
          $build = 'call "{0}" >nul && cl /nologo /EHsc /W4 /O2 /Fo"{1}" /Fe"{2}" "{3}" /link advapi32.lib ole32.lib' -f $setup, $obj, $exe, $source
          $cmdArgs = @('/d', '/s', '/c', $build)
          & cmd.exe @cmdArgs
          if ($LASTEXITCODE -ne 0) { throw "Native build failed: $LASTEXITCODE" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  etw-observer.exe" | Set-Content -Encoding utf8 (Join-Path $out 'SHA256SUMS')
          Get-Content (Join-Path $out 'SHA256SUMS')
          Remove-Item $obj
      - name: Run focused adapter test
        run: node --test tests/windows-observer-adapter.test.mjs
      - name: Upload native build and hash
        uses: actions/upload-artifact@v4
        with:
          name: windows-observer-build
          path: ${{ runner.temp }}/windows-adapter/
          if-no-files-found: error
