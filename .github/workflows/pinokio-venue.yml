name: Real Pinokio venue spike

on:
  push:
    branches:
      - feat/pinokio
      - main
      - release-1
      - 'int/**'
      - 'lane/M-PIN/**'
    paths:
      - '.github/workflows/**'
      - '.github/venue/**'
      - pinokio.js
      - pinokio.json
      - 'pinokio/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/venue/**'
      - pinokio.js
      - pinokio.json
      - 'pinokio/**'
      - 'tests/**'
  # T4 checkpoint rehearsal and RV-5 qualification can call this workflow at
  # the integrated Pinokio ref through workflow_call. Manual dispatch is also
  # available after this workflow exists on the repository's default branch.
  workflow_call:
    inputs:
      pinokio_ref:
        description: Exact Pinokio commit SHA to qualify
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-real-action:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-pinokio
          ref: ${{ inputs.pinokio_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Provision pinned sources
        run: |
          set -euo pipefail
          git clone https://github.com/pinokiocomputer/pinokiod.git "$RUNNER_TEMP/pinokiod"
          git -C "$RUNNER_TEMP/pinokiod" checkout --detach add4a674ad1ba95bb62ec427fce519fe5bf0e9bf
          git clone https://github.com/pinokiocomputer/pterm.git "$RUNNER_TEMP/pterm"
          git -C "$RUNNER_TEMP/pterm" checkout --detach 5be43718701c448b43daf0ce51d8935f170065bb
          npm ci --omit=dev --prefix "$RUNNER_TEMP/pterm" --silent
      - name: Build pinned daemon image
        run: docker build -t r20-pinokiod "$RUNNER_TEMP/pinokiod"
      - name: Run real Reset action and verify settlement
        run: bash .github/venue/linux.sh
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r20-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r20-evidence
          if-no-files-found: warn
          retention-days: 30

  native-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-pinokio
          ref: ${{ inputs.pinokio_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Probe native dependencies and launch
        shell: bash
        run: bash .github/venue/native.sh
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r20-native-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r20-evidence
          if-no-files-found: warn
          retention-days: 30
