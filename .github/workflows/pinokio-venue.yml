name: Real Pinokio venue spike

on:
  push:
    branches: [lane/M-PIN/R-20]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - name: Probe native dependencies and launch
        shell: bash
        run: bash .github/venue/native.sh
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r20-native-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r20-evidence
          if-no-files-found: warn
          retention-days: 30
