name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/venue/**'
      - pinokio.js
      - pinokio.json
      - 'pinokio/**'
      - 'tests/**'
  push:
    branches: [main, release-1, "int/**"]
  workflow_dispatch:
    inputs:
      r25_slot_id:
        description: Select one independent hosted macOS Pinokio mode; none runs the ordinary manual CI workflow
        required: true
        default: none
        type: choice
        options: [none, pinokio-backend-macos, pinokio-fully-local-macos]
      r25_agent_ref:
        description: Immutable snapshot collector source
        required: true
        default: a6b68d5b5478326a4db1971966d33a2cfe61d091
        type: string
      r25_candidate_tuple:
        description: Exact published CURRENT-TUPLE.json candidate
        required: true
        default: '{"app":"79f7e5397c044c4c97dc7e97b20ad96f787e5247","agent":"ab43bad818ef65ca1e929b973a2f61cd9fc4bf61","runtime":"2776ba973b6c8f3555b5629b0840d9691a98d3c2","pinokio":"3a6a98ae251ca126505245286e2d3e760f4348e9","manifest_sha256":"b2584f0bb5a949890364004572a0182f2b568adcdba061e73b739e1d3d2d623f","artifacts":{"public/install":"100bab1deb15d620abd910c8fb0c9a6d77f4945428a3229dac6b506705e3fd0d","public/install.sh":"591c4c51b148fccef2a7d1c45782d9ff949d5fd03d46cd82b5591e3a23d1b285","public/install.ps1":"bba3f2edc41c047cb51475ceeac4489a04610af73a3af44bdc05287964d28258"},"published_at":"2026-11-02T17:55:27Z"}'
        type: string
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  unit:
    if: github.event_name != 'workflow_dispatch' || inputs.r25_slot_id == 'none'
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node --test --test-reporter=spec tests/*.test.mjs
        shell: bash

  pinokio-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.r25_slot_id == 'none'
    name: Pinokio smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node tests/smoke/run-pinokio.mjs

  fully-local:
    name: Fully local (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.r25_slot_id == 'none'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node tests/smoke/run-pinokio.mjs fully-local

  hosted-r25-macos:
    name: R-25 hosted macOS (${{ inputs.r25_slot_id }})
    if: github.event_name == 'workflow_dispatch' && inputs.r25_slot_id != 'none'
    uses: ./.github/workflows/r25-snapshot-journey.yml
    with:
      agent_ref: ${{ inputs.r25_agent_ref }}
      slot_id: ${{ inputs.r25_slot_id }}
      candidate_tuple: ${{ inputs.r25_candidate_tuple }}
    permissions:
      actions: read
      contents: read
