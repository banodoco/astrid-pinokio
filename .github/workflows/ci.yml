name: CI

on:
  push:
    branches: [main, release-1, "int/**"]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ddd5d278796641901bd11508863a8ea21e6c9697
          path: ci-deps/astrid-agent
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: 1a275bb339ae897e52a5be5e1da99e846e402037
          path: ci-deps/astrid-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node --test --test-reporter=spec tests/*.test.mjs
        shell: bash
        env:
          ASTRID_AGENT_CHECKOUT: ${{ github.workspace }}/ci-deps/astrid-agent
          PYTHONPATH: ${{ github.workspace }}/ci-deps/astrid-runtime

  pinokio-smoke:
    name: Pinokio smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node tests/smoke/run-pinokio.mjs

  fully-local:
    name: Fully local (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node tests/smoke/run-pinokio.mjs fully-local
