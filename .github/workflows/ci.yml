name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/venue/**'
      - pinokio.js
      - pinokio.json
      - 'pinokio/**'
      - 'tests/**'
  push:
    branches: [main, release-1, "int/**"]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ab43bad818ef65ca1e929b973a2f61cd9fc4bf61
          path: astrid-agent
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-runtime
          ref: 2776ba973b6c8f3555b5629b0840d9691a98d3c2
          path: astrid-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --test --test-reporter=spec tests/*.test.mjs
        shell: bash
        env:
          ASTRID_AGENT_DIR: ${{ github.workspace }}/astrid-agent
          PYTHONPATH: ${{ github.workspace }}/astrid-runtime

  pinokio-smoke:
    name: Pinokio smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node tests/smoke/run-pinokio.mjs
      - name: Upload Linux smoke failure diagnostics
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pinokio-linux-smoke-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/astrid-pinokio-smoke-diagnostics/
          if-no-files-found: ignore

  fully-local:
    name: Fully local (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node tests/smoke/run-pinokio.mjs fully-local
