name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/venue/**'
      - pinokio.js
      - pinokio.json
      - 'pinokio/**'
      - 'tests/**'
  push:
    branches: [main, release-1, "int/**"]
  workflow_dispatch:
    inputs:
      agent_ref:
        description: 'Agent commit SHA for the focused Windows installed-schema proof (empty runs normal CI)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.agent_ref || 'standard' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent_ref == '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node --test --test-reporter=spec tests/*.test.mjs
        shell: bash

  pinokio-smoke:
    name: Pinokio smoke (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.agent_ref == '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node tests/smoke/run-pinokio.mjs

  fully-local:
    name: Fully local (ubuntu-latest)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_ref == '' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node tests/smoke/run-pinokio.mjs fully-local

  windows-installed-schema-proof:
    name: Windows installed-schema candidate proof
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_ref != '' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      AGENT_REF: ${{ inputs.agent_ref }}
      ASTRID_CI_JOB: windows-native-and-installer
      PROOF_DIR: ${{ github.workspace }}/windows-schema-proof
    steps:
      - name: Require an immutable Agent SHA
        shell: pwsh
        run: |
          if ($env:AGENT_REF -cnotmatch '^[0-9a-f]{40}$') { throw 'agent_ref must be a lowercase 40-character commit SHA' }
          New-Item -ItemType Directory -Force $env:PROOF_DIR | Out-Null
      - name: Check out and verify diagnostic route
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: route
          persist-credentials: false
      - name: Verify diagnostic route identity
        shell: pwsh
        working-directory: route
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) { throw "Diagnostic route checkout mismatch: $actual" }
      - name: Check out candidate Agent
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ inputs.agent_ref }}
          path: agent
          persist-credentials: false
      - name: Verify and record candidate identity
        shell: pwsh
        working-directory: agent
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:AGENT_REF) { throw "Agent checkout mismatch: $actual" }
          $runtime = (Get-Content runtime.lock.json -Raw | ConvertFrom-Json).source_commit
          if ($runtime -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid Runtime source pin' }
          "Agent SHA: $actual`nRuntime source pin: $runtime`nPinokio workflow SHA: $env:GITHUB_SHA`nRunner: $env:RUNNER_OS" | Tee-Object -FilePath "$env:PROOF_DIR/identity.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Agent test dependencies and its pinned Runtime
        working-directory: agent
        run: |
          python -m pip install -e '.[dev]' build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci_install_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run installed validator and Windows ACL tests
        working-directory: agent
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE/route/.github/scripts/windows-installed-schema-proof.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload candidate proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-schema-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROOF_DIR }}/
          if-no-files-found: warn
