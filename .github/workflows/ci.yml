name: CI

on:
  push:
    branches: [feat/pinokio, main]
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: App branch or tag to exercise
        required: false
        default: main
      app_sha:
        description: Exact App commit expected at that ref
        required: false
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node --test --test-reporter=spec tests/*.test.mjs
        shell: bash

  pinokio-smoke:
    env:
      ASTRID_SMOKE_APP_REF: ${{ inputs.app_ref || 'main' }}
      ASTRID_SMOKE_APP_SHA: ${{ inputs.app_sha || '' }}
    name: Pinokio smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node tests/smoke/run-pinokio.mjs

  fully-local:
    env:
      ASTRID_SMOKE_APP_REF: ${{ inputs.app_ref || 'main' }}
      ASTRID_SMOKE_APP_SHA: ${{ inputs.app_sha || '' }}
    name: Fully local (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: node tests/smoke/run-pinokio.mjs fully-local
