name: R-25 authenticated six-action snapshot journey

on:
  push:
    branches:
      - lane/M-PIN/R-25-MACOS-SNAPSHOT-SESSION-R1
      - lane/M-PIN/R-25-WINDOWS-LF-ROUTE-R1
      - lane/M-PIN/R-PIN-WINDOWS-EXISTING-VENUE
      - lane/M-PIN/R-PIN-WINDOWS-BOUNDED
      - lane/M-PIN/R-PIN-WINDOWS-CAPTURE
      - lane/M-PIN/R-PIN-WINDOWS-PTY-INTEGRATE
  workflow_call:
    inputs:
      agent_ref:
        required: true
        type: string
      slot_id:
        required: true
        type: string
      candidate_tuple:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      agent_ref:
        description: Immutable Agent snapshot collector commit
        required: true
        default: a6b68d5b5478326a4db1971966d33a2cfe61d091
        type: string
      slot_id:
        description: One independent hosted macOS mode
        required: true
        default: pinokio-fully-local-macos
        type: choice
        options: [pinokio-backend-macos, pinokio-fully-local-macos, pinokio-fully-local-windows]
      candidate_tuple:
        description: Exact published CURRENT-TUPLE.json candidate
        required: true
        default: '{"app":"79f7e5397c044c4c97dc7e97b20ad96f787e5247","agent":"ab43bad818ef65ca1e929b973a2f61cd9fc4bf61","runtime":"2776ba973b6c8f3555b5629b0840d9691a98d3c2","pinokio":"3a6a98ae251ca126505245286e2d3e760f4348e9","manifest_sha256":"b2584f0bb5a949890364004572a0182f2b568adcdba061e73b739e1d3d2d623f","artifacts":{"public/install":"100bab1deb15d620abd910c8fb0c9a6d77f4945428a3229dac6b506705e3fd0d","public/install.sh":"591c4c51b148fccef2a7d1c45782d9ff949d5fd03d46cd82b5591e3a23d1b285","public/install.ps1":"bba3f2edc41c047cb51475ceeac4489a04610af73a3af44bdc05287964d28258"},"published_at":"2026-11-02T17:55:27Z"}'
        type: string

permissions:
  actions: read
  contents: read

jobs:
  macos-six-action:
    name: R-25 macOS (${{ inputs.slot_id || 'pinokio-fully-local-macos' }}) / macos-six-action
    if: (github.event_name == 'push' && github.ref_name == 'lane/M-PIN/R-25-MACOS-SNAPSHOT-SESSION-R1') || (github.event_name == 'workflow_dispatch' && (inputs.slot_id == 'pinokio-backend-macos' || inputs.slot_id == 'pinokio-fully-local-macos'))
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGENT_REF: ${{ inputs.agent_ref || 'a6b68d5b5478326a4db1971966d33a2cfe61d091' }}
      SLOT_ID: ${{ inputs.slot_id || 'pinokio-fully-local-macos' }}
      R25_TARGET_OS: macos
      R25_SLOT_ID: ${{ inputs.slot_id || 'pinokio-fully-local-macos' }}
      PINOKIOD_REF: add4a674ad1ba95bb62ec427fce519fe5bf0e9bf
      PTERM_REF: 5be43718701c448b43daf0ce51d8935f170065bb
      R25_TUPLE_JSON: ${{ inputs.candidate_tuple || '{"app":"79f7e5397c044c4c97dc7e97b20ad96f787e5247","agent":"ab43bad818ef65ca1e929b973a2f61cd9fc4bf61","runtime":"2776ba973b6c8f3555b5629b0840d9691a98d3c2","pinokio":"3a6a98ae251ca126505245286e2d3e760f4348e9","manifest_sha256":"b2584f0bb5a949890364004572a0182f2b568adcdba061e73b739e1d3d2d623f","artifacts":{"public/install":"100bab1deb15d620abd910c8fb0c9a6d77f4945428a3229dac6b506705e3fd0d","public/install.sh":"591c4c51b148fccef2a7d1c45782d9ff949d5fd03d46cd82b5591e3a23d1b285","public/install.ps1":"bba3f2edc41c047cb51475ceeac4489a04610af73a3af44bdc05287964d28258"},"published_at":"2026-11-02T17:55:27Z"}' }}
    steps:
      - name: Preserve exact Git blob bytes on macOS
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact Agent collector source
        shell: bash
        env:
          AGENT_ROOT: ${{ runner.temp }}/astrid-agent
        run: |
          set -euo pipefail
          test "$AGENT_REF" = 'a6b68d5b5478326a4db1971966d33a2cfe61d091'
          node -e 'const got=JSON.parse(process.env.R25_TUPLE_JSON); const want=JSON.parse(process.argv[1]); if(JSON.stringify(got)!==JSON.stringify(want)) throw new Error("candidate_tuple differs from published CURRENT-TUPLE.json")' '{"app":"79f7e5397c044c4c97dc7e97b20ad96f787e5247","agent":"ab43bad818ef65ca1e929b973a2f61cd9fc4bf61","runtime":"2776ba973b6c8f3555b5629b0840d9691a98d3c2","pinokio":"3a6a98ae251ca126505245286e2d3e760f4348e9","manifest_sha256":"b2584f0bb5a949890364004572a0182f2b568adcdba061e73b739e1d3d2d623f","artifacts":{"public/install":"100bab1deb15d620abd910c8fb0c9a6d77f4945428a3229dac6b506705e3fd0d","public/install.sh":"591c4c51b148fccef2a7d1c45782d9ff949d5fd03d46cd82b5591e3a23d1b285","public/install.ps1":"bba3f2edc41c047cb51475ceeac4489a04610af73a3af44bdc05287964d28258"},"published_at":"2026-11-02T17:55:27Z"}'
          git clone --filter=blob:none --no-checkout https://github.com/banodoco/astrid-agent.git "$AGENT_ROOT"
          git -C "$AGENT_ROOT" fetch --no-tags --depth=1 origin "$AGENT_REF"
          git -C "$AGENT_ROOT" config core.autocrlf false
          git -C "$AGENT_ROOT" config core.eol lf
          git -C "$AGENT_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$AGENT_ROOT" rev-parse HEAD)" = "$AGENT_REF"
      - name: Materialize pinned native engine dependencies
        shell: bash
        env:
          PINOKIOD_ROOT: ${{ runner.temp }}/pinokiod
          PTERM_ROOT: ${{ runner.temp }}/pterm
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/pinokiocomputer/pinokiod.git "$PINOKIOD_ROOT"
          git -C "$PINOKIOD_ROOT" fetch --no-tags --depth=1 origin "$PINOKIOD_REF"
          git -C "$PINOKIOD_ROOT" config core.autocrlf false
          git -C "$PINOKIOD_ROOT" config core.eol lf
          git -C "$PINOKIOD_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$PINOKIOD_ROOT" rev-parse HEAD)" = "$PINOKIOD_REF"
          npm ci --omit=dev --prefix "$PINOKIOD_ROOT" --silent
          git clone --filter=blob:none --no-checkout https://github.com/pinokiocomputer/pterm.git "$PTERM_ROOT"
          git -C "$PTERM_ROOT" fetch --no-tags --depth=1 origin "$PTERM_REF"
          git -C "$PTERM_ROOT" config core.autocrlf false
          git -C "$PTERM_ROOT" config core.eol lf
          git -C "$PTERM_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$PTERM_ROOT" rev-parse HEAD)" = "$PTERM_REF"
          npm ci --omit=dev --prefix "$PTERM_ROOT" --silent
      - name: Validate immutable sources and focused route checks
        shell: bash
        env:
          AGENT_ROOT: ${{ runner.temp }}/astrid-agent
        run: |
          set -euo pipefail
          assert_git_blob_bytes() {
            local root="$1" relative="$2" blob actual
            blob="$(git -C "$root" rev-parse "HEAD:$relative")"
            actual="$(git -C "$root" hash-object --no-filters -- "$relative")"
            test "$actual" = "$blob" || { echo "Git blob bytes changed after checkout: $root $relative ($actual != $blob)" >&2; return 1; }
          }
          assert_git_blob_bytes "$GITHUB_WORKSPACE" pinokio/providers/r25-snapshot-macos.cjs
          assert_git_blob_bytes "$GITHUB_WORKSPACE" pinokio/providers/r25-snapshot-windows.cjs
          assert_git_blob_bytes "$AGENT_ROOT" scripts/pinokio_snapshot_collector.py
          assert_git_blob_bytes "$AGENT_ROOT" scripts/pinokio_snapshot_macos.py
          assert_git_blob_bytes "$AGENT_ROOT" scripts/pinokio_snapshot_windows.py
          node pinokio/providers/r25-native-collector-binding.cjs \
            --validate-source-only true --agent-ref "$AGENT_REF" \
            --agent-root "$AGENT_ROOT" --pinokio-root "$GITHUB_WORKSPACE"
          node --test tests/r25-native-collector-binding.test.cjs tests/r25-snapshot-macos.test.cjs tests/r25-conda-provision.test.cjs
          python -m py_compile \
            "$AGENT_ROOT/scripts/pinokio_snapshot_collector.py" \
            "$AGENT_ROOT/scripts/pinokio_snapshot_macos.py"
          node --check .github/venue/r25-snapshot-runner.cjs
      - name: Run real six-action macOS session
        shell: bash
        env:
          AGENT_ROOT: ${{ runner.temp }}/astrid-agent
          PINOKIOD_ROOT: ${{ runner.temp }}/pinokiod
          PTERM_ROOT: ${{ runner.temp }}/pterm
          PYTHON: python
          R25_OUTPUT: ${{ runner.temp }}/r25-snapshot-output
          R25_DIAGNOSTICS: ${{ runner.temp }}/r25-diagnostics
          PINOKIO_HOME: ${{ runner.temp }}/pinokio-home
        run: |
          set -euo pipefail
          test "$(id -u)" -gt 0
          test "$(id -un)" != root
          bash .github/venue/r25-provision-macos-conda.sh
          export R25_LAUNCHD_TARGET="gui/$(id -u)/haus.astrid.runtime"
          node .github/venue/r25-snapshot-runner.cjs \
            --agent-root "$AGENT_ROOT" --pinokiod "$PINOKIOD_ROOT" \
            --pterm "$PTERM_ROOT" --output "$R25_OUTPUT"
      - name: Retain authenticated R-25 snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-snapshots-${{ env.SLOT_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r25-snapshot-output
          if-no-files-found: warn
          retention-days: 30
      - name: Retain bounded failure and inner-exit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-snapshot-diagnostics-${{ env.SLOT_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r25-diagnostics
          if-no-files-found: warn
          retention-days: 30
  windows-six-action:
    if: (github.event_name == 'push' && (github.ref_name == 'lane/M-PIN/R-25-WINDOWS-LF-ROUTE-R1' || github.ref_name == 'lane/M-PIN/R-PIN-WINDOWS-EXISTING-VENUE' || github.ref_name == 'lane/M-PIN/R-PIN-WINDOWS-BOUNDED' || github.ref_name == 'lane/M-PIN/R-PIN-WINDOWS-CAPTURE' || github.ref_name == 'lane/M-PIN/R-PIN-WINDOWS-PTY-INTEGRATE')) || (github.event_name == 'workflow_dispatch' && inputs.slot_id == 'pinokio-fully-local-windows')
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AGENT_REF: ${{ github.event_name == 'push' && 'a6b68d5b5478326a4db1971966d33a2cfe61d091' || inputs.agent_ref }}
      SLOT_ID: ${{ github.event_name == 'push' && 'pinokio-fully-local-windows' || inputs.slot_id }}
      SETUP_ONLY: ${{ github.event_name == 'push' && (github.ref_name == 'lane/M-PIN/R-PIN-WINDOWS-EXISTING-VENUE' || github.ref_name == 'lane/M-PIN/R-PIN-WINDOWS-BOUNDED' || github.ref_name == 'lane/M-PIN/R-PIN-WINDOWS-CAPTURE' || github.ref_name == 'lane/M-PIN/R-PIN-WINDOWS-PTY-INTEGRATE') }}
      PINOKIOD_REF: add4a674ad1ba95bb62ec427fce519fe5bf0e9bf
      PTERM_REF: 5be43718701c448b43daf0ce51d8935f170065bb
      R25_SETUP_TIMEOUT_MS: 600000
      R25_TUPLE_JSON: >-
        {"app":"79f7e5397c044c4c97dc7e97b20ad96f787e5247","agent":"ab43bad818ef65ca1e929b973a2f61cd9fc4bf61","runtime":"2776ba973b6c8f3555b5629b0840d9691a98d3c2","pinokio":"3a6a98ae251ca126505245286e2d3e760f4348e9","manifest_sha256":"b2584f0bb5a949890364004572a0182f2b568adcdba061e73b739e1d3d2d623f","artifacts":{"public/install":"100bab1deb15d620abd910c8fb0c9a6d77f4945428a3229dac6b506705e3fd0d","public/install.sh":"591c4c51b148fccef2a7d1c45782d9ff949d5fd03d46cd82b5591e3a23d1b285","public/install.ps1":"bba3f2edc41c047cb51475ceeac4489a04610af73a3af44bdc05287964d28258"},"published_at":"2026-11-02T17:55:27Z"}
    steps:
      - name: Preserve exact Git blob bytes on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact Agent collector source
        shell: pwsh
        env:
          AGENT_ROOT: ${{ runner.temp }}\astrid-agent
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AGENT_REF -ne 'a6b68d5b5478326a4db1971966d33a2cfe61d091') { throw 'agent_ref differs' }
          git clone --filter=blob:none --no-checkout https://github.com/banodoco/astrid-agent.git $env:AGENT_ROOT
          git -C $env:AGENT_ROOT fetch --no-tags --depth=1 origin $env:AGENT_REF
          git -C $env:AGENT_ROOT config core.autocrlf false
          git -C $env:AGENT_ROOT config core.eol lf
          git -C $env:AGENT_ROOT checkout --detach FETCH_HEAD
          if ((git -C $env:AGENT_ROOT rev-parse HEAD) -ne $env:AGENT_REF) { throw 'Agent HEAD differs' }
      - name: Materialize pinned native engine dependencies
        shell: pwsh
        env:
          PINOKIOD_ROOT: ${{ runner.temp }}\pinokiod
          PTERM_ROOT: ${{ runner.temp }}\pterm
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none --no-checkout https://github.com/pinokiocomputer/pinokiod.git $env:PINOKIOD_ROOT
          git -C $env:PINOKIOD_ROOT fetch --no-tags --depth=1 origin $env:PINOKIOD_REF
          git -C $env:PINOKIOD_ROOT config core.autocrlf false
          git -C $env:PINOKIOD_ROOT config core.eol lf
          git -C $env:PINOKIOD_ROOT checkout --detach FETCH_HEAD
          if ((git -C $env:PINOKIOD_ROOT rev-parse HEAD) -ne $env:PINOKIOD_REF) { throw 'pinokiod HEAD differs' }
          npm ci --omit=dev --prefix $env:PINOKIOD_ROOT --silent
          git clone --filter=blob:none --no-checkout https://github.com/pinokiocomputer/pterm.git $env:PTERM_ROOT
          git -C $env:PTERM_ROOT fetch --no-tags --depth=1 origin $env:PTERM_REF
          git -C $env:PTERM_ROOT config core.autocrlf false
          git -C $env:PTERM_ROOT config core.eol lf
          git -C $env:PTERM_ROOT checkout --detach FETCH_HEAD
          if ((git -C $env:PTERM_ROOT rev-parse HEAD) -ne $env:PTERM_REF) { throw 'pterm HEAD differs' }
          npm ci --omit=dev --prefix $env:PTERM_ROOT --silent
      - name: Validate immutable sources and focused route checks
        shell: pwsh
        env:
          AGENT_ROOT: ${{ runner.temp }}\astrid-agent
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-NativeExit([string]$Command) {
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) { throw "$Command failed with exit code $exitCode" }
          }
          function Assert-GitBlobBytes([string]$Root, [string]$Relative) {
            $blob = (git -C $Root rev-parse "HEAD:${Relative}").Trim()
            $gitExitCode = $LASTEXITCODE
            if ($gitExitCode -ne 0) { throw "Cannot resolve Git blob: $Root $Relative" }
            $actual = (git -C $Root hash-object --no-filters -- $Relative).Trim()
            $gitExitCode = $LASTEXITCODE
            if ($gitExitCode -ne 0 -or $actual -ne $blob) {
              throw "Git blob bytes changed after checkout: $Root $Relative ($actual != $blob)"
            }
          }
          @(
            @{ Root = $env:GITHUB_WORKSPACE; Relative = 'pinokio/providers/r25-snapshot-macos.cjs' },
            @{ Root = $env:GITHUB_WORKSPACE; Relative = 'pinokio/providers/r25-snapshot-windows.cjs' },
            @{ Root = $env:AGENT_ROOT; Relative = 'scripts/pinokio_snapshot_collector.py' },
            @{ Root = $env:AGENT_ROOT; Relative = 'scripts/pinokio_snapshot_macos.py' },
            @{ Root = $env:AGENT_ROOT; Relative = 'scripts/pinokio_snapshot_windows.py' }
          ) | ForEach-Object { Assert-GitBlobBytes $_.Root $_.Relative }
          node pinokio/providers/r25-native-collector-binding.cjs `
            --validate-source-only true --agent-ref $env:AGENT_REF `
            --agent-root $env:AGENT_ROOT --pinokio-root $env:GITHUB_WORKSPACE
          Assert-NativeExit 'Source validation'
          node --test tests/r25-native-collector-binding.test.cjs tests/r25-snapshot-windows.test.cjs tests/r25-windows-process-snapshot.test.cjs tests/r25-setup-diagnostics.test.mjs
          Assert-NativeExit 'Focused route tests'
          python -m py_compile `
            "$env:AGENT_ROOT\scripts\pinokio_snapshot_collector.py" `
            "$env:AGENT_ROOT\scripts\pinokio_snapshot_windows.py"
          Assert-NativeExit 'Python syntax checks'
          node --check .github/venue/r25-snapshot-runner.cjs
          Assert-NativeExit 'r25 snapshot runner syntax check'
          node --check .github/venue/r21-observer-diagnostics.cjs
          Assert-NativeExit 'r21 observer diagnostics syntax check'
          node --check .github/venue/r25-windows-process-snapshot.cjs
          Assert-NativeExit 'Windows process snapshot syntax check'
          node --check pinokio/shell.mjs
          Assert-NativeExit 'Pinokio shell syntax check'
      - name: Run bounded Windows setup diagnostic or six-action session
        shell: pwsh
        env:
          AGENT_ROOT: ${{ runner.temp }}\astrid-agent
          PINOKIOD_ROOT: ${{ runner.temp }}\pinokiod
          PTERM_ROOT: ${{ runner.temp }}\pterm
          R25_OUTPUT: ${{ runner.temp }}\r25-snapshot-output
          R25_DIAGNOSTICS: ${{ runner.temp }}\r25-diagnostics
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SETUP_ONLY -eq 'true') {
            node .github/venue/r25-snapshot-runner.cjs `
              --agent-root $env:AGENT_ROOT --pinokiod $env:PINOKIOD_ROOT `
              --pterm $env:PTERM_ROOT --output $env:R25_OUTPUT `
              --setup-only true --setup-timeout-ms $env:R25_SETUP_TIMEOUT_MS
          } else {
            node .github/venue/r25-snapshot-runner.cjs `
              --agent-root $env:AGENT_ROOT --pinokiod $env:PINOKIOD_ROOT `
              --pterm $env:PTERM_ROOT --output $env:R25_OUTPUT
          }
      - name: Retain authenticated R-25 snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-snapshots-pinokio-fully-local-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\r25-snapshot-output
          if-no-files-found: warn
          retention-days: 30
      - name: Retain bounded failure and inner-exit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-snapshot-diagnostics-pinokio-fully-local-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\r25-diagnostics
          if-no-files-found: warn
          retention-days: 30
